name: Meta Publish
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Keep publishing disabled
        required: true
        default: true
        type: boolean
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -c "from src.platforms.meta.client import MetaAdapter; print(MetaAdapter(dry_run=True))"
